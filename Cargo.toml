[package]
name = "vim_crawl"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]
resolver = "3"
members = ["crates/*", "ramen_assets", "."]
default-members = ["crates/*", "."]

[workspace.dependencies]
bevy = "0.18.1"
bevy_egui = "0.39.1"
bevy-inspector-egui = "0.36.0"

[dependencies]
bevy = { workspace = true }
bevy_egui = { workspace = true }
game_assets = { path = "crates/game_assets" }
game_core = { path = "crates/game_core" }
game_ui = { path = "crates/game_ui" }
vim_engine = { path = "crates/vim_engine" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
